services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      DATABASE_URL: postgresql+psycopg://jarvis:jarvis_dev_password@db:5432/jarvis
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CHROMA_PATH: /app/data/chroma
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - chroma_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
volumes:
  postgres_data:
  chroma_data:
