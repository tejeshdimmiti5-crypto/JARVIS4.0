services:
  - type: web
    name: jarvis-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://jarvis-ui.onrender.com

  - type: web
    name: jarvis-ui
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /

databases:
  - name: jarvis-db
    plan: free
    region: singapore
    databaseName: jarvis
    user: jarvis
